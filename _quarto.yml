project:
  type: website

website:
  title: Research Engineering Handbook
  navbar:
    background: primary
  sidebar:
    contents: auto
    style: docked
    # collapse-level: 1
  repo-url: https://github.com/Bristol-REG/handbook
  repo-actions: [edit, issue]
  page-footer:
    left: "Living document by the [Research Engineering Group](https://bristol-reg.github.io/), [CC BY 4.0](http://creativecommons.org/licenses/by/4.0/)."
    right:
      - icon: globe2
        href: "https://bristol-reg.github.io/"
      - icon: folder
        href: "https://uob.sharepoint.com/teams/grp-ResearchEngineering/Shared%20Documents/"
      - icon: github
        href: "https://github.com/Bristol-REG"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true

# Recommended by https://quarto.org/docs/publishing/github-pages.html#freezing-computations
# (although we're not expecting to be executing any code)
execute:
  freeze: auto
